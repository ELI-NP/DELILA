#***************************************************************************************
# Board Connection Parameters:
#***************************************************************************************
#[BOARD 0]  Open USB 0 0
[BOARD 0]  Open PCI 0 3 0
[BOARD 1]  Open PCI 0 4 0
[BOARD 2]  Open PCI 0 5 0
[BOARD 3]  Open PCI 0 6 0
[COMMON]

#---------------------------------------------------------------------------------------
# Acquisition Modes
#---------------------------------------------------------------------------------------
#AcquisitionMode               MIXED
AcquisitionMode               LIST
RecordLength                  496
PreTrigger                    48

#---------------------------------------------------------------------------------------
# Sync/Trg/Coinc Logic
#---------------------------------------------------------------------------------------
FPIOtype                      NIM
#StartMode                     SYNCIN_1ST_SW
StartMode                     SYNCIN_SLAVE
#StartMode                     INDEP_SW
SyncinMode                    RUN_CTRL
#SyncinMode                    DISABLED
#TrginMode                     EXTTRG_START
VetoWindow                    0
TrgoutMode                    SYNC_OUT
TrgoutMask                    FF

#---------------------------------------------------------------------------------------
# On-board Coincidences
#---------------------------------------------------------------------------------------
CoincMode                     DISABLED
#CoincMode                     PAIRED_NAND
#CoincMode                     CH0_NAND_ANY
#MajorityLevel                 3
CoincWindow                   1000

#---------------------------------------------------------------------------------------
# Input Settings
#---------------------------------------------------------------------------------------
EnableInput                   1
PulsePolarity                 NEGATIVE
BaselineDCoffset              10
NSBaseline                    3
InputDynamicRange             0
#ChargeSensitivity             2
EnergyCoarseGain              16

#---------------------------------------------------------------------------------------
# Discriminator
#---------------------------------------------------------------------------------------
DiscrMode                     CFD_PSD
TriggerThreshold              100
CFDdelay                      6
CFDfraction                   2
GateWidth                     700
ShortGateWidth                80
PreGate                       100
TrgHoldOff                    1024
TTFsmoothing                  0
#TTFdelay                      48

