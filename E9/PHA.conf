########################################################################################
# Typical Config File for HPGe detectors
########################################################################################

#***************************************************************************************
# Board Connection Parameters:
#***************************************************************************************
#[BOARD 0]  Open USB 0 0
[BOARD 0]  Open PCI 1 0 0
[BOARD 1]  Open PCI 1 1 0
#[BOARD 2]  Open PCI 0 2 0
#[BOARD 3]  Open PCI 0 3 0
#[BOARD 4]  Open PCI 2 0 0
[COMMON]

#---------------------------------------------------------------------------------------
# Acquisition Modes
#---------------------------------------------------------------------------------------
#AcquisitionMode               MIXED
AcquisitionMode               LIST
RecordLength                  1024 # in samples, 4ns
PreTrigger                    500  # in samples, 4ns
EventBuffering                0

#---------------------------------------------------------------------------------------
# Sync/Trg/Coinc Logic
#---------------------------------------------------------------------------------------
FPIOtype                      NIM
#StartMode                     SYNCIN_1ST_SW
StartMode                     SYNCIN_SLAVE
#StartMode                     INDEP_SW
SyncinMode                    RUN_CTRL
#SyncinMode                    DISABLED
TrginMode                     EXTTRG_START
VetoWindow                    0
TrgoutMode                    SYNC_OUT
TrgoutMask                    FF

#---------------------------------------------------------------------------------------
# On-board Coincidences
#---------------------------------------------------------------------------------------
CoincMode                     DISABLED
#CoincMode                     PAIRED_NAND
#CoincMode                     CH0_NAND_ANY
#MajorityLevel                 3
CoincWindow                   1000

#---------------------------------------------------------------------------------------
# Input Settings
#---------------------------------------------------------------------------------------
EnableInput                   1
PulsePolarity                 POSITIVE
BaselineDCoffset              20
InputDynamicRange             1
Decimation                    0

#---------------------------------------------------------------------------------------
# Discriminator
#---------------------------------------------------------------------------------------
DiscrMode                     RCCR2_PHA
#DiscrMode                     LED_PHA
TriggerThreshold              100
TrgHoldOff                    480
TTFsmoothing                  3
TTFdelay                      96

#---------------------------------------------------------------------------------------
# Trapezoidal Filter (DPP-PHA)
#---------------------------------------------------------------------------------------
NSPeak                        1
PeakHoldOff                   992
TrapNSBaseline                3
TrapRiseTime                  2000
TrapFlatTop                   1000
TrapPoleZero                  36000
PeakingTime                   600

