########################################################################################
# Typical Config File for HPGe detectors
########################################################################################

#***************************************************************************************
# Board Connection Parameters:
#***************************************************************************************
#[BOARD 0]  Open USB_CONET 26005 0 0
#[BOARD 0]  Open PCI 2 0 0
[BOARD 0]  Open PCI 0 0 0
[BOARD 1]  Open PCI 0 1 0
#[BOARD 2]  Open PCI 0 2 0
#[BOARD 3]  Open PCI 0 3 0
[COMMON]

#---------------------------------------------------------------------------------------
# Acquisition Modes
#---------------------------------------------------------------------------------------
#AcquisitionMode               MIXED
AcquisitionMode               LIST
RecordLength                  4096 # in ns (16ns step)
PreTrigger                    128 #in ns, Maximum 496.  More than it, ADC become 0.
EventBuffering                0

#---------------------------------------------------------------------------------------
# Sync/Trg/Coinc Logic
#---------------------------------------------------------------------------------------
FPIOtype                      NIM
StartMode                     SYNCIN_1ST_SW
#StartMode                     SYNCIN_SLAVE
#StartMode                     INDEP_SW
Slave                         0
SyncinMode                    RUN_CTRL
#SyncinMode                    DISABLED
TrginMode                     EXTTRG_START
VetoWindow                    0
TrgoutMode                    SYNC_OUT
TrgoutMask                    FF

#---------------------------------------------------------------------------------------
# On-board Coincidences
#---------------------------------------------------------------------------------------
TrgMode                       NORMAL # 0
#TrgMode                       PAIRED # 1
#TrgMode                       EXTERNAL # 2
CoincMode                     DISABLED
#CoincMode                     PAIRED_NAND
#CoincMode                     CH0_NAND_ANY
#MajorityLevel                 3
CoincWindow                   1000

#---------------------------------------------------------------------------------------
# Input Settings
#---------------------------------------------------------------------------------------
EnableInput                   1
PulsePolarity                 POSITIVE
BaselineDCoffset              10
NSBaseline                    1 # 4^NSBaseline samples
#ZeroVoltLevel                 1000
InputDynamicRange             0
#ChargeSensitivity             0
ChargeSensitivity             0
##ChargeSensitivity 0 = 0.16 pC, 1 = 0.32 pC, 2 = 0.64 pC, 3 = 1.28 pC, 4 = 2.56 pC, 5 = 5.12 pC, 6 = 10.24 pC, 7 = 20.48 pC

#---------------------------------------------------------------------------------------
# Discriminator
#---------------------------------------------------------------------------------------
DiscrMode                     LED
TriggerThreshold              200
GateWidth                     2048 # in ns
PreGate                       64 # in ns
TrgHoldOff                    1024 # in ns
TTFsmoothing                  0
#TTFdelay                      48

