########################################################################################
# Typical Config File for HPGe detectors
########################################################################################

#***************************************************************************************
# Board Connection Parameters:
#***************************************************************************************
#[BOARD 0]  Open USB 0 0
[BOARD 0]  Open PCI 2 0 0
#[BOARD 1]  Open PCI 2 1 0
#[BOARD 2]  Open PCI 0 2 0
#[BOARD 3]  Open PCI 0 3 0
#[BOARD 4]  Open PCI 2 0 0
[COMMON]

#---------------------------------------------------------------------------------------
# Acquisition Modes
#---------------------------------------------------------------------------------------
#AcquisitionMode               MIXED
AcquisitionMode               LIST
RecordLength                  5000 # in samples, 4ns
PreTrigger                    500  # in samples, 4ns
EventBuffering                0

#---------------------------------------------------------------------------------------
# Sync/Trg/Coinc Logic
#---------------------------------------------------------------------------------------
FPIOtype                      NIM
StartMode                     SYNCIN_SLAVE
#StartMode                     SYNCIN_1ST_SW
#StartMode                     INDEP_SW
SyncinMode                    RUN_CTRL
#SyncinMode                    DISABLED
TrginMode                     EXTTRG_START
VetoWindow                    0
TrgoutMode                    SYNC_OUT
TrgoutMask                    FF

#---------------------------------------------------------------------------------------
# On-board Coincidences
#---------------------------------------------------------------------------------------
CoincMode                     DISABLED
#CoincMode                     PAIRED_NAND
#CoincMode                     CH0_NAND_ANY
#MajorityLevel                 3
CoincWindow                   1000

#---------------------------------------------------------------------------------------
# Input Settings
#---------------------------------------------------------------------------------------
EnableInput                   1
PulsePolarity                 POSITIVE
BaselineDCoffset              20
InputDynamicRange             0
Decimation                    0
#PileUpMode                    1
#PurGap                        8

#---------------------------------------------------------------------------------------
# Discriminator
#---------------------------------------------------------------------------------------
DiscrMode                     RCCR2_PHA
#DiscrMode                     LED_PHA
TriggerThreshold              100
TrgHoldOff                    480
TTFsmoothing                  5
TTFdelay                      440
EnergyCoarseGain              4

#---------------------------------------------------------------------------------------
# Trapezoidal Filter (DPP-PHA)
#---------------------------------------------------------------------------------------
NSPeak                        1
PeakHoldOff                   1400
TrapNSBaseline                5
TrapRiseTime                  6000
TrapFlatTop                   2000
TrapPoleZero                  47000
PeakingTime                   1000

